name: Unisoc ROM Port (system-only)

# Requires these binaries committed in the repo under bin/ (chmod +x is handled in-workflow):
#   bin/pacextractor   - unpacks .pac firmware -> raw partition images
#   bin/lpunpack       - unpacks super.img -> per-partition raw images
# lpmake and lpdump are NOT needed anymore — this workflow doesn't rebuild a super.img
# at all. It only extracts and patches system/system_ext/product from the donor ROM,
# leaving vendor/odm/vendor_dlkm/everything else on the phone completely untouched.
# erofs-utils (mkfs.erofs / fsck.erofs) is installed via apt at runtime.
# OTA zips (type `ota`, A/B payload.bin) are handled by scripts/extract_ota.sh,
# which downloads payload-dumper-go on first use.

on:
  workflow_dispatch:
    inputs:
      target_rom_url:
        description: "Direct download URL for TARGET/donor firmware (type declared below)"
        required: true
        type: string
        default: "https://drive.usercontent.google.com/download?id=1rYaX6YTEt3GiqAjT41kQnPo0rwuBuB3D&export=download&authuser=1&confirm=t&uuid=465d9d96-66fc-4000-bf20-7d70c648b856&at=AFYLz4Pwl7AJjGIuPzYzflTpxBRF:1788233813645"
      target_rom_type:
        description: "What target_rom_url points to"
        required: true
        type: choice
        options:
          - super.img
          - super.bin
          - pac
          - pac.zip
          - ota
        default: super.img
      base_ota_url:
        description: "Optional: direct URL for the BASE full OTA (required only if target_rom_url is an incremental/delta OTA)"
        required: false
        type: string
        default: ""
      patch_transsion_anticrack:
        description: "Remove Transsion anti-crack block + force SELinux permissive on system.img (Itel/Infinix/Techno only)"
        required: true
        type: boolean
        default: true
      apply_headphone_jack_fix:
        description: "Headphone jack fix."
        required: true
        type: boolean
        default: false
      apply_brightness_lag_fix:
        description: "Fix Brightness and Lag."
        required: true
        type: boolean
        default: false
      apply_display_config_fix:
        description: "Install Smart 8 panel display configs (fixes display-server crashes on donors with empty brightness maps)."
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # required so GITHUB_TOKEN can create a release + upload assets

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs android-sdk-libsparse-utils python3 unzip curl xxd rsync zip attr aria2

      - name: Prepare binaries
        run: |
          chmod +x bin/pacextractor bin/lpunpack scripts/*.sh
          mkdir -p work/target_raw work/target_unpacked work/result

      - name: Cache downloaded target firmware
        # Skips re-downloading entirely on repeat runs with the same URL+type —
        # useful while iterating. Costs cache quota (10GB/repo total) though, so
        # if you're caching other things too and hitting evictions, delete this
        # step and the corresponding `if:` below to go back to always-download.
        id: cache-target
        uses: actions/cache@v4
        with:
          path: work/target_raw
          key: target-rom-${{ inputs.target_rom_type }}-${{ inputs.target_rom_url }}

      - name: Download target firmware
        if: steps.cache-target.outputs.cache-hit != 'true'
        run: |
          scripts/download_input.sh "${{ inputs.target_rom_url }}" work/target_raw "${{ inputs.target_rom_type }}"

      - name: Cache base FULL OTA (delta only)
        if: inputs.target_rom_type == 'ota' && inputs.base_ota_url != ''
        id: cache-base
        uses: actions/cache@v4
        with:
          path: work/base_raw
          key: base-rom-ota-${{ inputs.base_ota_url }}

      - name: Download base FULL OTA (delta only)
        if: inputs.target_rom_type == 'ota' && inputs.base_ota_url != '' && steps.cache-base.outputs.cache-hit != 'true'
        run: |
          scripts/download_input.sh "${{ inputs.base_ota_url }}" work/base_raw "ota"

      - name: Extract target -> super.img
        if: inputs.target_rom_type != 'ota'
        run: |
          scripts/get_super.sh work/target_raw work/target_super "${{ inputs.target_rom_type }}"

      - name: Extract partitions from OTA zip
        if: inputs.target_rom_type == 'ota'
        run: |
          OTA_ZIP="$(find work/target_raw -maxdepth 1 -type f -name 'input.zip' | head -n1)"
          BASE_ZIP="$(find work/base_raw -maxdepth 1 -type f -name 'input.zip' 2>/dev/null | head -n1 || true)"
          if [ "${{ inputs.base_ota_url }}" != "" ] && [ -z "$BASE_ZIP" ]; then
            echo "ERROR: base_ota_url was given but work/base_raw/input.zip is missing."
            echo "The 'Download base FULL OTA' step was probably skipped (cache miss handling)."
            exit 1
          fi
          scripts/extract_ota.sh "$OTA_ZIP" work/result "$BASE_ZIP"

      - name: lpunpack target super.img
        if: inputs.target_rom_type != 'ota'
        run: |
          bin/lpunpack work/target_super/super.img work/target_unpacked
          ls -la work/target_unpacked

      - name: Collect donor system/system_ext/product
        if: inputs.target_rom_type != 'ota'
        run: |
          scripts/collect_donor_partitions.sh work/target_unpacked work/result

      - name: Patch system.img (build.prop, SELinux, anti-crack)
        run: |
          SYSTEM_PROP_FLAG=""
          if [ "${{ inputs.apply_brightness_lag_fix }}" = "true" ]; then
            SYSTEM_PROP_FLAG="--system-prop patches/system.prop"
          fi
          scripts/patch_system.sh \
            --system-img work/result/system.img \
            --transsion-anticrack "${{ inputs.patch_transsion_anticrack }}" \
            $SYSTEM_PROP_FLAG

      - name: Patch product.img (headphone jack overlay)
        if: ${{ inputs.apply_headphone_jack_fix }}
        run: |
          scripts/patch_product.sh \
            --product-img work/result/product.img \
            --overlay-apk patches/devinputjack.apk

      - name: Patch product.img (Smart 8 display configs)
        if: ${{ inputs.apply_display_config_fix }}
        run: |
          scripts/patch_display.sh \
            --product-img work/result/product.img

      - name: Prepare release assets
        id: assets
        run: |
          mkdir -p work/release_assets
          cp work/result/system.img work/release_assets/
          cp work/result/system_ext.img work/release_assets/
          cp work/result/product.img work/release_assets/
          sha256sum work/release_assets/*.img > work/release_assets/checksums.sha256
          ls -la work/release_assets
          if [ -f work/result/donor-info.env ]; then
            # shellcheck disable=SC1091
            . ./work/result/donor-info.env
            echo "donor_device=${DONOR_DEVICE:-unknown}" >> "$GITHUB_OUTPUT"
            echo "donor_android=${DONOR_ANDROID:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "donor_device=unknown" >> "$GITHUB_OUTPUT"
            echo "donor_android=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip partitions and upload to GoFile
        id: gofile
        run: |
          ZIP_NAME="port-${{ github.run_number }}-system-system_ext-product.zip"
          (cd work/release_assets && zip "$ZIP_NAME" system.img system_ext.img product.img checksums.sha256)
          LINK="$(scripts/upload_gofile.sh "work/release_assets/$ZIP_NAME" | grep -oE 'https://gofile.io/d/[A-Za-z0-9]+' | head -n1 || true)"
          if [ -z "$LINK" ]; then
            LINK="(upload failed — see run log)"
          fi
          echo "gofile_url=$LINK" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: tag
        run: |
          echo "tag=port-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload partitions to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Ported system/system_ext/product - run #${{ github.run_number }}"
          body: |
            Automated donor-partition extraction (no super.img rebuild — vendor/odm/
            vendor_dlkm and everything else on the device stays completely untouched).

            - Donor device: `${{ steps.assets.outputs.donor_device }}`
            - Donor Android version: `${{ steps.assets.outputs.donor_android }}`
            - GoFile mirror (images): `${{ steps.gofile.outputs.gofile_url }}`
            - Transsion anti-crack patch on system.img: `${{ inputs.patch_transsion_anticrack }}`
            - Headphone jack fix (product/overlay): `${{ inputs.apply_headphone_jack_fix }}`
            - Fix Brightness and Lag (system.prop -> build.prop): `${{ inputs.apply_brightness_lag_fix }}`
            - Smart 8 display configs (product displayconfig fix): `${{ inputs.apply_display_config_fix }}`
            - Target ROM type: `${{ inputs.target_rom_type }}`

            Images are NOT attached here (the zip exceeds GitHub's 2 GB release-asset
            limit) — download them from the GoFile mirror above. Only
            checksums.sha256 is attached; verify it against the downloaded files.
            Flash individually, e.g.:
            ```
            fastboot flash system system.img
            fastboot flash system_ext system_ext.img
            fastboot flash product product.img
            ```
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            work/release_assets/checksums.sha256
