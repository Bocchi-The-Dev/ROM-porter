name: Unisoc ROM Port

# Requires these binaries committed in the repo under bin/ (chmod +x is handled in-workflow):
#   bin/pacextractor   - unpacks .pac firmware -> raw partition images
#   bin/lpunpack       - unpacks super.img -> per-partition raw images
#   bin/lpmake         - rebuilds a super.img from per-partition raw images
# lpdump is NOT needed — scripts/build_super.py parses the LP metadata directly.
# erofs-utils (mkfs.erofs / fsck.erofs) is installed via apt at runtime, no need to commit it.

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Direct download URL for STOCK firmware (type declared below)"
        required: true
        type: string
        default: "https://drive.usercontent.google.com/download?id=1UVbtlNQFGudQaKpI-ktaREmRcF5m_yE2&export=download&authuser=0&confirm=t&uuid=a9b8c663-a8ac-4665-8ba3-73e678a30104&at=AFYLz4NAF8uzAOSPenxEYQ5FAYCz%3A1788233231086"
      stock_rom_type:
        description: "What stock_rom_url points to"
        required: true
        type: choice
        options:
          - super.img
          - super.bin
          - pac
          - pac.zip
        default: super.img
      target_rom_url:
        description: "Direct download URL for TARGET/donor firmware (type declared below)"
        required: true
        type: string
        default: "https://drive.usercontent.google.com/download?id=1rYaX6YTEt3GiqAjT41kQnPo0rwuBuB3D&export=download&authuser=1&confirm=t&uuid=465d9d96-66fc-4000-bf20-7d70c648b856&at=AFYLz4Pwl7AJjGIuPzYzflTpxBRF:1788233813645"
      target_rom_type:
        description: "What target_rom_url points to"
        required: true
        type: choice
        options:
          - super.img
          - super.bin
          - pac
          - pac.zip
        default: super.img
      device_codenames:
        description: "Comma-separated init script codenames, e.g. X6525,P671LN (matched against any init*<codename>*.rc in vendor/etc/init/hw)"
        required: true
        type: string
        default: X6525
      partition_type:
        description: "Super partition layout of your device"
        required: true
        type: choice
        options:
          - virtual-ab
          - ab
          - a-only
        default: virtual-ab
      patch_transsion_anticrack:
        description: "Remove Transsion anti-crack block + force SELinux permissive (Itel/Infinix/Techno only)"
        required: true
        type: boolean
        default: true
      sparse_output:
        description: "Sparse-compress the final super.img"
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # required so GITHUB_TOKEN can create a release + upload assets

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space (super.img work needs several GB of headroom)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs android-sdk-libsparse-utils python3 unzip curl xxd rsync zip

      - name: Prepare binaries
        run: |
          chmod +x bin/pacextractor bin/lpunpack bin/lpmake
          mkdir -p work/stock_raw work/target_raw work/stock_unpacked work/target_unpacked work/result work/logs

      - name: Download stock firmware
        run: |
          scripts/download_input.sh "${{ inputs.stock_rom_url }}" work/stock_raw "${{ inputs.stock_rom_type }}"

      - name: Download target firmware
        run: |
          scripts/download_input.sh "${{ inputs.target_rom_url }}" work/target_raw "${{ inputs.target_rom_type }}"

      - name: Extract stock -> super.img
        run: |
          scripts/get_super.sh work/stock_raw work/stock_super "${{ inputs.stock_rom_type }}"

      - name: Extract target -> super.img
        run: |
          scripts/get_super.sh work/target_raw work/target_super "${{ inputs.target_rom_type }}"

      - name: lpunpack stock super.img
        run: |
          bin/lpunpack work/stock_super/super.img work/stock_unpacked
          ls -la work/stock_unpacked

      - name: lpunpack target super.img
        run: |
          bin/lpunpack work/target_super/super.img work/target_unpacked
          ls -la work/target_unpacked

      - name: Assemble Result Port Rom raw partitions
        run: |
          scripts/assemble_partitions.sh work/stock_unpacked work/target_unpacked work/result

      - name: Patch system + vendor (build.prop, SELinux, anti-crack)
        run: |
          scripts/patch_rom.sh \
            --result-dir work/result \
            --target-unpacked work/target_unpacked \
            --device-codenames "${{ inputs.device_codenames }}" \
            --transsion-anticrack "${{ inputs.patch_transsion_anticrack }}"

      - name: Rebuild super.img
        run: |
          SPARSE_FLAG=""
          if [ "${{ inputs.sparse_output }}" = "true" ]; then
            SPARSE_FLAG="--sparse"
          fi
          python3 scripts/build_super.py \
            --stock-super work/stock_super/super.img \
            --result-dir work/result \
            --partition-type "${{ inputs.partition_type }}" \
            --output work/final_super.img \
            $SPARSE_FLAG

      - name: Package logs
        run: |
          if [ -d work/logs ] && [ "$(ls -A work/logs 2>/dev/null)" ]; then
            zip -r work/logs.zip work/logs
          else
            echo "no logs to package" > work/logs_empty.txt
            zip work/logs.zip work/logs_empty.txt
          fi

      - name: Set release tag
        id: tag
        run: |
          echo "tag=port-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload super.img to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Ported ROM (${{ inputs.device_codenames }}) - run #${{ github.run_number }}"
          body: |
            Automated Unisoc ROM port build.

            - Device codenames: `${{ inputs.device_codenames }}`
            - Partition type: `${{ inputs.partition_type }}`
            - Transsion anti-crack patch: `${{ inputs.patch_transsion_anticrack }}`
            - Sparse output: `${{ inputs.sparse_output }}`
            - Stock ROM type: `${{ inputs.stock_rom_type }}`
            - Target ROM type: `${{ inputs.target_rom_type }}`
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            work/final_super.img
            work/logs.zip
